name: Update Pickleball Calendar

on:
  schedule:
    # Runs daily at 07:00 UTC (08:00 BST / 07:00 GMT)
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push calendar.ics if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "No changes to calendar.ics — nothing to commit."
          else
            git commit -m "chore: update calendar.ics [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
